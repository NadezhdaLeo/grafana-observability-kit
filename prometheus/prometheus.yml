global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: demo

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Simulated application fleet: api, worker, db, queue, plus market-session metrics.
  # honor_labels: the generator exposes its own `instance` label (api-0, db-primary, ...);
  # without this Prometheus would rename it to exported_instance and every rule
  # that selects on instance= would silently never fire.
  - job_name: apps
    honor_labels: true
    static_configs:
      - targets: ["metrics-generator:8000"]
